services:
  postgres:
    image: postgres:16
    container_name: osberplite-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - osberplite_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: OsbErpLite.Api/Dockerfile
    container_name: osberplite-api
    env_file:
      - .env
    environment:
      CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SAP_API_BASE_URL: ${SAP_API_BASE_URL}
      SAP_API_KEY: ${SAP_API_KEY}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5019:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - osberplite_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  osberplite_postgres_data:
  osberplite_logs:
