services:
  postgres:
    image: postgres:16
    container_name: osberplite-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - osberplite_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  osberplite_postgres_data:
