services:
  postgres:
    image: postgres:16
    container_name: osberplite-postgres
    environment:
      POSTGRES_DB: OsbErpLiteDb
      POSTGRES_USER: osbadmin
      POSTGRES_PASSWORD: OsbDev2026!
    ports:
      - "5433:5432"
    volumes:
      - osberplite_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  osberplite_postgres_data:
